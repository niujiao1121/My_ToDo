name: AI 自动创建 TODO

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  ai-create-todo:
    runs-on: ubuntu-latest

    concurrency:
      group: ai-create-todo-${{ github.event.issue.number }}
      cancel-in-progress: true
    
    # 只在以下情况运行：
    # 1. Issue 在被打上 ai-todo-inbox 标签时触发
    # 2. 评论以 /todo 开头
    if: |
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'ai-todo-inbox') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/todo'))
    
    steps:
      - name: 检查权限
        id: check-permission
        uses: actions/github-script@v7
        with:
          script: |
            // 检查用户是否是仓库成员或协作者
            try {
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.actor
              });

              const hasPermission = ['admin', 'write', 'maintain'].includes(permission.permission);

              if (!hasPermission) {
                const issueNumber = context.payload.issue.number;
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: '❌ 抱歉，只有仓库成员可以使用 AI TODO 创建功能。'
                });
                core.setFailed('用户没有足够的权限');
              }

              return hasPermission;
            } catch (error) {
              core.error('检查权限时出错：' + error.message);
              return false;
            }

      - name: AI 解析并创建 TODO
        if: steps.check-permission.outputs.result == 'true'
        uses: actions/github-script@v7
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        with:
          script: |
            const https = require('https');

            const SYSTEM_LABELS = [
              'project', 'epic', 'task-with-deadline', 'task-open', 'subtask', 'ai-todo-inbox',
              'priority:critical', 'priority:high', 'priority:medium', 'priority:low',
              'status:planning', 'status:in-progress', 'status:blocked', 'status:review', 'status:testing',
              'type:feature', 'type:enhancement', 'type:bug', 'type:refactoring', 'type:documentation', 'type:research',
              'help-wanted', 'good-first-issue', 'duplicate', 'wontfix', 'archived'
            ];

            const escapeRegExp = (string) => string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

            // 兼容 Issue Forms：提取指定字段的内容（支持 ## / ### 标题）
            const extractFormField = (body, labels = []) => {
              if (!body) return '';
              for (const label of labels) {
                const pattern = new RegExp(`###?\s*${escapeRegExp(label)}\s*\n+([\s\S]+?)(?=\n###?|\n---|$)`, 'i');
                const match = body.match(pattern);
                if (match && match[1]) {
                  return match[1].trim();
                }
              }
              return '';
            };

            // 获取用户输入
            let userInputs = []; // 改为数组以支持批量创建
            let sourceIssueNumber = null;
            let autoParentIssue = null; // 自动检测的父任务

            if (context.eventName === 'issues') {
              let userInput = context.payload.issue.body || '';
              sourceIssueNumber = context.payload.issue.number;
              // 清理模板中的注释
              userInput = userInput.replace(/<!--[\s\S]*?-->/g, '').trim();
              // 优先从 Issue Forms 标题字段提取内容（兼容 ### / ##）
              const formInput = extractFormField(userInput, ['我要做的事', '简要描述（必填）', '简要描述']);
              if (formInput) {
                userInput = formInput;
              }
              userInputs.push(userInput);
            } else if (context.eventName === 'issue_comment') {
              const comment = (context.payload.comment.body || '').trim();
              sourceIssueNumber = context.payload.issue.number;
              // 当从评论创建时，自动设置父任务为被评论的issue
              autoParentIssue = sourceIssueNumber;

              // 检测多个 /todo 命令（支持批量创建）
              const todoPattern = /^\/todo\s+(.+)$/gmi;
              const matches = [...comment.matchAll(todoPattern)];
              
              if (matches.length > 0) {
                // 找到多个 /todo 命令
                userInputs = matches.map(match => match[1].trim());
                core.info('检测到 ' + matches.length + ' 个 /todo 命令');
              } else {
                // 兼容旧格式：整个评论以 /todo 开头
                const singleTodo = comment.replace(/^\/todo\s+/i, '').trim();
                if (singleTodo) {
                  userInputs.push(singleTodo);
                }
              }
            }
            
            if (userInputs.length === 0 || !userInputs[0]) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: sourceIssueNumber,
                body: '❌ 请提供要创建的 TODO 内容。'
              });
              return;
            }

            // 避免重复创建：
            // - 对 issue_comment 触发，只有当最新的 /todo 评论之后已经有机器人生成的结果时才跳过
            // - 对 issues 触发，保持原有的防重复逻辑
            try {
              const { data: existingComments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: sourceIssueNumber,
                per_page: 50
              });

              const processedMarkers = ['AI 已成功创建 TODO', '批量 TODO 创建完成'];
              const isMarkerComment = (comment) =>
                processedMarkers.some(marker => comment.body && comment.body.includes(marker)) &&
                comment.user && comment.user.login === 'github-actions[bot]';

              let alreadyProcessed = false;

              if (context.eventName === 'issue_comment') {
                const currentCreatedAt = new Date(context.payload.comment.created_at);

                // 找到当前评论之前（含当前）的最新 /todo 评论时间
                const latestTodoComment = existingComments
                  .filter(c => {
                    const hasTodo = (c.body || '').toLowerCase().includes('/todo');
                    return hasTodo && new Date(c.created_at) <= currentCreatedAt;
                  })
                  .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

                if (latestTodoComment) {
                  const latestTodoTime = new Date(latestTodoComment.created_at);

                  // 只有当最新的 /todo 评论之后已经有机器人回复了成功/批量完成提示才认为已处理
                  alreadyProcessed = existingComments.some(comment =>
                    isMarkerComment(comment) && new Date(comment.created_at) >= latestTodoTime
                  );
                }
              } else {
                alreadyProcessed = existingComments.some(comment => isMarkerComment(comment));
              }

              if (alreadyProcessed) {
                core.info('检测到当前 Issue 已有 AI 创建 TODO 的结果，跳过重复处理');
                return;
              }
            } catch (commentError) {
              core.warning('检查是否已处理时出错：' + commentError.message + '，将继续尝试创建');
            }

            // 检查阿里云 API Key
            if (!process.env.DASHSCOPE_API_KEY) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: sourceIssueNumber,
                body: '❌ 阿里云 API Key 未配置。请在仓库的 Secrets 中添加 `DASHSCOPE_API_KEY`。\n\n配置步骤：https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/blob/main/docs/AI_SETUP.md'
              });
              return;
            }
            
            // 批量创建 TODO - 为每个输入创建一个 Issue
            const createdIssues = [];
            const batchCount = userInputs.length;
            
            // 如果是批量创建，先发送提示消息
            if (batchCount > 1) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: sourceIssueNumber,
                body: '🔄 检测到 ' + batchCount + ' 个 TODO，正在批量创建...'
              });
            }
            
            // 构建 AI 提示词（在循环外定义，重复使用）
            // Note: 使用字符串拼接而非模板字面量以避免 YAML 解析问题
            const currentDate = new Date().toISOString().split('T')[0];
            const systemPrompt = '你是一个专业的任务管理助手。用户会用中文或英文描述一个任务，你需要将其解析为结构化的 TODO。\n\n' +
              '当前日期: ' + currentDate + '\n\n' +
              '请分析用户输入，提取以下信息并以 JSON 格式返回：\n\n' +
              '{\n' +
              '  "title": "简洁明了的任务标题（10-50字）",\n' +
              '  "description": "详细的任务描述，包含背景和具体要做的事情",\n' +
              '  "parent_issue": "父任务编号，如果用户提到 #数字、parent #数字、属于#数字、从属于#数字、子任务、subtask of 等，提取数字，否则为 null",\n' +
              '  "due_date": "截止日期 YYYY-MM-DD 格式，如果用户提到了日期相关的词（今天、明天、下周等）则计算具体日期，否则为 null",\n' +
              '  "priority": "优先级: critical/high/medium/low，根据用户用词判断（紧急、重要等），默认 medium",\n' +
              '  "estimated_hours": "预计工作量（小时数），如果用户提到了工作量则提取，否则根据任务复杂度估算，格式如 \'8\' 或 \'16-24\'",\n' +
              '  "acceptance_criteria": ["验收标准1", "验收标准2"],\n' +
              '  "task_checklist": ["步骤1", "步骤2"],\n' +
              '  "task_type": "任务类型: deadline 或 open，如果有截止日期用 deadline，否则用 open"\n' +
              '}\n\n' +
              '父任务识别规则：\n' +
              '- "#数字" 格式（如 "#123"）-> 提取数字 123\n' +
              '- "parent #数字"、"Parent: #数字" -> 提取数字\n' +
              '- "属于 #数字"、"从属于 #数字" -> 提取数字\n' +
              '- "是 #数字 的子任务" -> 提取数字\n' +
              '- "subtask of #数字" -> 提取数字\n' +
              '- 如果没有提到父任务 -> null\n\n' +
              '日期识别规则：\n' +
              '- "今天" -> ' + currentDate + '\n' +
              '- "明天" -> 当前日期+1天\n' +
              '- "后天" -> 当前日期+2天\n' +
              '- "下周" -> 当前日期+7天\n' +
              '- "下周一/二/..." -> 计算下周对应的日期\n' +
              '- "下月" -> 当前日期+30天\n' +
              '- "月底" -> 当月最后一天\n' +
              '- 具体日期如 "12月25日" -> 转换为 YYYY-MM-DD\n\n' +
              '优先级判断：\n' +
              '- 包含"紧急"、"urgent"、"ASAP"、"立即" -> critical\n' +
              '- 包含"重要"、"high"、"关键" -> high\n' +
              '- 包含"一般"、"normal"、"medium" -> medium\n' +
              '- 包含"不急"、"low"、"可选" -> low\n' +
              '- 默认 -> medium\n\n' +
              '只返回 JSON，不要有任何其他文字。';

            // 循环处理每个 TODO 输入
            for (let todoIndex = 0; todoIndex < userInputs.length; todoIndex++) {
              const userInput = userInputs[todoIndex];
              core.info('处理第 ' + (todoIndex + 1) + '/' + batchCount + ' 个 TODO: ' + userInput);

            const userPrompt = '用户输入：\n' + userInput;
            
            // 调用阿里云千问 API
            let aiResponse;
            try {
              const postData = JSON.stringify({
                model: 'qwen3.6-plus-2026-04-02',
                messages: [
                  { role: 'system', content: systemPrompt },
                  { role: 'user', content: userPrompt }
                ],
                temperature: 0.3,
                response_format: { type: 'json_object' }
              });
              
              const options = {
                hostname: 'dashscope.aliyuncs.com',
                path: '/compatible-mode/v1/chat/completions',
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + process.env.DASHSCOPE_API_KEY,
                  'Content-Length': Buffer.byteLength(postData)
                }
              };
              
              aiResponse = await new Promise((resolve, reject) => {
                const req = https.request(options, (res) => {
                  let data = '';
                  res.on('data', (chunk) => { data += chunk; });
                  res.on('end', () => {
                    if (res.statusCode === 200) {
                      resolve(JSON.parse(data));
                    } else {
                      reject(new Error('API 请求失败: ' + res.statusCode + ' - ' + data));
                    }
                  });
                });
                
                req.on('error', (error) => reject(error));
                req.write(postData);
                req.end();
              });
              
              core.info('阿里云 API 响应：' + JSON.stringify(aiResponse));
              
            } catch (error) {
              core.error('调用阿里云 API 失败：' + error.message);
              
              // 失败时使用基本信息创建 Issue
              try {
                const basicIssue = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '[TODO] ' + userInput.substring(0, 50),
                  body: '## 📋 任务描述\n\n' + userInput + '\n\n---\n\n*此 TODO 由 AI 助手自动创建（AI 解析失败，使用基本格式）*',
                  labels: ['task-open', 'priority:medium'],
                  assignees: [context.actor]
                });
                
                createdIssues.push({
                  number: basicIssue.data.number,
                  title: userInput.substring(0, 50),
                  url: basicIssue.data.html_url,
                  error: 'AI 解析失败'
                });
              } catch (createError) {
                core.error('创建基本 Issue 也失败：' + createError.message);
                createdIssues.push({
                  error: '创建失败: ' + createError.message,
                  input: userInput
                });
              }
              
              // 继续处理下一个 TODO
              continue;
            }
            
            // 解析 AI 响应
            let parsedData;
            try {
              const content = aiResponse.choices[0].message.content;
              parsedData = JSON.parse(content);
              core.info('解析后的数据：' + JSON.stringify(parsedData));
              
              const normalizeParentIssue = (value) => {
                if (value === null || value === undefined) {
                  return null;
                }
                const text = String(value).trim();
                if (!text) {
                  return null;
                }
                const match = text.match(/\d+/);
                return match ? match[0] : null;
              };

              parsedData.parent_issue = normalizeParentIssue(parsedData.parent_issue);

              // 如果从评论创建且AI没有识别出父任务，使用自动检测的父任务
              if (autoParentIssue && !parsedData.parent_issue) {
                parsedData.parent_issue = autoParentIssue.toString();
                core.info('自动设置父任务为: ' + autoParentIssue);
              }
            } catch (error) {
              core.error('解析 AI 响应失败：' + error.message);
              createdIssues.push({
                error: '解析失败: ' + error.message,
                input: userInput
              });
              // 继续处理下一个 TODO
              continue;
            }
            
            // 构建 Issue 内容
            const taskType = parsedData.task_type === 'deadline' ? 'task-with-deadline' : 'task-open';
            const titlePrefix = taskType === 'task-with-deadline' ? '[TASK]' : '[OPEN]';
            
            // 添加父任务标记（如果指定了父任务）
            const parentIssueSection = parsedData.parent_issue 
              ? '\n\n## 🔗 父任务\n\n**Parent Issue**: #' + parsedData.parent_issue
              : '';
            
            let issueBody = '';
            
            if (taskType === 'task-with-deadline') {
              // 有截止日期的任务模板
              const acceptanceCriteria = parsedData.acceptance_criteria && parsedData.acceptance_criteria.length > 0 
                ? parsedData.acceptance_criteria.map(c => '- [ ] ' + c).join('\n')
                : '- [ ] 待补充';
              const taskChecklist = parsedData.task_checklist && parsedData.task_checklist.length > 0
                ? parsedData.task_checklist.map(t => '- [ ] ' + t).join('\n')
                : '- [ ] 待补充';
              
              issueBody = '## 📋 任务描述\n\n' + parsedData.description + parentIssueSection + '\n\n' +
                '## ⏰ 时间要求\n\n' +
                '**截止日期**: ' + (parsedData.due_date || '待定') + ' ⏰\n' +
                '**预计工作量**: ' + (parsedData.estimated_hours || '待评估') + '小时\n\n' +
                '## ✅ 验收标准\n\n' + acceptanceCriteria + '\n\n' +
                '## 📝 任务清单\n\n' + taskChecklist + '\n\n' +
                '---\n\n' +
                '*此 TODO 由阿里云 AI 助手根据输入自动创建*\n' +
                '*原始输入来自: #' + sourceIssueNumber + '*';
            } else {
              // 开放性任务模板
              const acceptanceCriteria = parsedData.acceptance_criteria && parsedData.acceptance_criteria.length > 0 
                ? parsedData.acceptance_criteria.map(c => '- [ ] ' + c).join('\n')
                : '- [ ] 待补充';
              const taskChecklist = parsedData.task_checklist && parsedData.task_checklist.length > 0
                ? parsedData.task_checklist.map((t, i) => (i + 1) + '. ' + t).join('\n')
                : '待补充';
              
              issueBody = '## 📋 任务描述\n\n' + parsedData.description + parentIssueSection + '\n\n' +
                '## 🎯 完成条件\n\n' +
                '**预计工作量**: ' + (parsedData.estimated_hours || '待评估') + '小时\n\n' +
                '**验收标准**: \n' + acceptanceCriteria + '\n\n' +
                '## 📝 实现思路\n\n' + taskChecklist + '\n\n' +
                '---\n\n' +
                '*此 TODO 由阿里云 AI 助手根据输入自动创建*\n' +
                '*原始输入来自: #' + sourceIssueNumber + '*';
            }
            
            // 确定标签
            const labels = [taskType, 'priority:' + (parsedData.priority || 'medium')];
            // 只有从评论创建的子任务才添加 subtask 标签
            // 从 issue 创建时，即使有父任务也不添加，因为原 issue 会被删除
            // context.eventName 来自workflow触发事件：'issues' 或 'issue_comment'
            if (parsedData.parent_issue && context.eventName === 'issue_comment') {
              labels.push('subtask');
            }
            
            // 如果有截止日期，创建或查找对应的 Milestone
            let milestoneNumber = null;
            if (parsedData.due_date && taskType === 'task-with-deadline') {
              try {
                // 生成 milestone 标题（格式：YYYY-MM-DD Deadline）
                const milestoneTitle = parsedData.due_date + ' Deadline';
                
                // 查找是否已存在相同日期的 milestone
                // 注意：只查找前 30 个 open milestones（GitHub API 默认限制）
                // 对于大多数仓库来说这已经足够
                const { data: existingMilestones } = await github.rest.issues.listMilestones({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open'
                });
                
                const existingMilestone = existingMilestones.find(m => m.title === milestoneTitle);
                
                if (existingMilestone) {
                  milestoneNumber = existingMilestone.number;
                  core.info('使用现有 Milestone #' + milestoneNumber + ': ' + milestoneTitle);
                } else {
                  // 创建新的 milestone
                  const { data: newMilestone } = await github.rest.issues.createMilestone({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: milestoneTitle,
                    due_on: parsedData.due_date + 'T23:59:59Z',
                    description: '截止日期为 ' + parsedData.due_date + ' 的任务集合'
                  });
                  milestoneNumber = newMilestone.number;
                  core.info('创建新 Milestone #' + milestoneNumber + ': ' + milestoneTitle);
                }
              } catch (error) {
                core.warning('创建或查找 Milestone 失败：' + error.message);
                // Milestone 创建失败不影响 Issue 创建，继续执行
              }
            }
            
            // 创建新 Issue
            try {
              const issueParams = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titlePrefix + ' ' + parsedData.title,
                body: issueBody,
                labels: labels,
                assignees: [context.actor]
              };
              
              // 如果有 milestone，添加到 issue 参数中
              if (milestoneNumber) {
                issueParams.milestone = milestoneNumber;
              }
              
              const newIssue = await github.rest.issues.create(issueParams);
              
            const sanitizeLabel = (label) => {
              // 移除 Markdown 前缀、项目符号和分隔符，避免将 "##"、"-" 等解析成标签
              const cleaned = String(label || '')
                .replace(/^[#*\-\u2022•\s]+/, '')
                .replace(/[#,，\s]+$/g, '')
                .trim();

              // 过滤空值、控制字符，避免触发 GitHub 的 "Validation Failed" 报错
              if (!cleaned || /[\p{C}]/u.test(cleaned)) {
                return null;
              }

              // GitHub 标签名称最大长度 50，超出则丢弃
              if (cleaned.length > 50) {
                return null;
              }

              return cleaned;
            };

            const collectCustomLabels = ({ sourceLabels = [], existingLabels = [], projectLabels = [] }) => {
              const customLabels = [...projectLabels];
              sourceLabels.forEach(label => {
                const labelName = typeof label === 'string' ? label : label.name;
                if (!SYSTEM_LABELS.includes(labelName) && !customLabels.includes(labelName)) {
                  customLabels.push(labelName);
                }
              });

              const sanitized = [...new Set(customLabels.map(l => sanitizeLabel(l)).filter(Boolean))];
              return sanitized.filter(label => !existingLabels.includes(label));
            };

            // 如果指定了父任务，尝试更新父任务并继承项目标签
            const parentIssueNumber = parsedData.parent_issue ? parseInt(parsedData.parent_issue) : null;
            if (parentIssueNumber) {
              try {
                const fetchParentIssue = async () => github.rest.issues.get({
                  owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parentIssueNumber
                  });

                  const parentIssue = await fetchParentIssue();

                  // 提取父任务的项目标签（从 issue body 中提取）
                  const parentBody = parentIssue.data.body || '';
                  // 匹配 **项目标签**: 后面的内容，跳过所有HTML注释
                  const projectLabelsMatch = parentBody.match(/\*\*项目标签\*\*:\s*(?:<!--[\s\S]*?-->\s*)*([^\n<]+)/);

                  let projectLabels = [];
                  if (projectLabelsMatch && projectLabelsMatch[1]) {
                    const labelText = projectLabelsMatch[1].trim();
                    const normalizedLabelText = labelText.replace(/\s*:\s*/g, ':');
                    if (labelText && labelText !== '' && labelText !== '-' && labelText !== 'N/A') {
                      // 解析标签，支持逗号、空格、中文逗号分隔
                      projectLabels = normalizedLabelText.split(/[,，\s]+/)
                        .map(l => sanitizeLabel(l))
                        .filter(l => l && l !== '' && l !== '-');
                      core.info('从父任务提取到项目标签: ' + projectLabels.join(', '));
                    }
                  }

                  const parentLabels = parentIssue.data.labels || [];
                  const currentLabels = newIssue.data.labels.map(l =>
                    typeof l === 'string' ? l : l.name
                  );
                  const labelsToAdd = collectCustomLabels({
                    sourceLabels: parentLabels,
                    existingLabels: currentLabels,
                    projectLabels
                  });

                  if (labelsToAdd.length > 0) {
                    await github.rest.issues.addLabels({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: newIssue.data.number,
                      labels: labelsToAdd
                    });
                    core.info('成功为子任务添加项目标签: ' + labelsToAdd.join(', '));
                  }

                  // 在父任务中添加子任务链接，避免重复并兼容不同格式的子任务清单
                  const subtaskEntry = '- [ ] #' + newIssue.data.number + ' - ' + parsedData.title;
                  const existingEntryPattern = new RegExp('^\\s*-\\s*\\[[ xX]?\\]\\s*#' + newIssue.data.number + '\\b', 'm');

                  const buildUpdatedBody = (bodyText) => {
                    // 如果已经存在相同的子任务记录，则直接返回原文
                    if (existingEntryPattern.test(bodyText)) {
                      core.info('父任务已包含子任务 #' + newIssue.data.number + '，跳过重复追加');
                      return bodyText;
                    }

                    const lines = bodyText.split('\n');
                    const sectionIndex = lines.findIndex(line =>
                      line.includes('## 📝 子任务列表') || line.includes('## 子任务列表')
                    );

                    if (sectionIndex >= 0) {
                      let insertIndex = sectionIndex + 1;
                      // 跳过注释行与空行
                      while (insertIndex < lines.length && (lines[insertIndex].trim() === '' || lines[insertIndex].trim().startsWith('<'))) {
                        insertIndex++;
                      }
                      lines.splice(insertIndex, 0, subtaskEntry);
                      return lines.join('\n');
                    }

                    return (bodyText ? bodyText + '\n\n' : '') + '## 📝 子任务列表\n\n' + subtaskEntry;
                  };

                  const attemptUpdate = async () => {
                    const latestParent = await fetchParentIssue();
                    const latestBody = latestParent.data.body || '';
                    const updatedBody = buildUpdatedBody(latestBody);

                    if (updatedBody !== latestBody) {
                      await github.rest.issues.update({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: parentIssueNumber,
                        body: updatedBody
                      });
                      core.info('成功更新父任务 #' + parentIssueNumber);
                    }
                  };

                  try {
                    await attemptUpdate();
                  } catch (updateError) {
                    core.warning('首次更新父任务失败，尝试重新获取后重试：' + updateError.message);
                    await attemptUpdate();
                  }
                } catch (error) {
                  core.warning('更新父任务失败：' + error.message);
                  // 即使更新父任务失败，也继续处理
                }
              }

              if (context.eventName === 'issues') {
                const sourceLabels = context.payload.issue.labels || [];
                const currentLabels = newIssue.data.labels.map(l =>
                  typeof l === 'string' ? l : l.name
                );
                const labelsToAdd = collectCustomLabels({
                  sourceLabels,
                  existingLabels: currentLabels
                });

                if (labelsToAdd.length > 0) {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: newIssue.data.number,
                    labels: labelsToAdd
                  });
                  core.info('成功为 TODO 继承原始 Issue 标签: ' + labelsToAdd.join(', '));
                }
              }
              
              // 记录成功创建的 Issue
              createdIssues.push({
                number: newIssue.data.number,
                title: parsedData.title,
                url: newIssue.data.html_url,
                priority: parsedData.priority || 'medium',
                dueDate: parsedData.due_date || '无',
                parent: parsedData.parent_issue
              });
              
              core.info('成功创建 Issue #' + newIssue.data.number);
              
            } catch (error) {
              core.error('创建 Issue 失败：' + error.message);
              createdIssues.push({
                error: '创建 Issue 失败: ' + error.message,
                input: userInput
              });
            }
            
            } // 结束批量创建循环
            
            // 批量创建完成后，发送汇总消息
            let summaryMessage = '';
            const successCount = createdIssues.filter(i => !i.error).length;
            const failCount = createdIssues.filter(i => i.error).length;
            
            if (batchCount > 1) {
              // 批量创建的汇总消息
              summaryMessage = '✅ **批量 TODO 创建完成！**\n\n';
              summaryMessage += '📊 **统计**: 成功 ' + successCount + ' 个，失败 ' + failCount + ' 个\n\n';
              
              if (successCount > 0) {
                summaryMessage += '### ✅ 成功创建的 TODO\n\n';
                let successIndex = 0;
                createdIssues.forEach((item) => {
                  if (!item.error) {
                    successIndex++;
                    const parentInfo = item.parent ? ' (子任务 #' + item.parent + ')' : '';
                    summaryMessage += successIndex + '. [#' + item.number + '](' + item.url + ') - ' + item.title + parentInfo + '\n';
                  }
                });
              }
              
              if (failCount > 0) {
                summaryMessage += '\n### ❌ 创建失败的 TODO\n\n';
                let failIndex = 0;
                createdIssues.forEach((item) => {
                  if (item.error) {
                    failIndex++;
                    summaryMessage += failIndex + '. ' + item.error;
                    if (item.input) {
                      summaryMessage += ' - 输入: ' + item.input.substring(0, 50) + '...';
                    }
                    summaryMessage += '\n';
                  }
                });
              }
              
              summaryMessage += '\n---\n\n💡 提示：AI 自动解析可能不完全准确，请查看并补充完善信息。';
            } else if (successCount === 1) {
              // 单个 TODO 创建的消息
              const item = createdIssues[0];
              if (!item.error) {
                const parentInfo = item.parent ? '\n🔗 **父任务**: #' + item.parent : '';
                const milestoneInfo = item.dueDate !== '无' ? '\n🎯 **Milestone**: 已关联到截止日期 Milestone' : '';
                summaryMessage = '✅ **AI 已成功创建 TODO!**\n\n' +
                  '📌 **新 Issue**: #' + item.number + '\n' +
                  '📝 **标题**: ' + item.title + '\n' +
                  '⏰ **截止日期**: ' + item.dueDate + '\n' +
                  '🏷️ **优先级**: ' + item.priority + parentInfo + milestoneInfo + '\n\n' +
                  '[查看详情 →](' + item.url + ')\n\n' +
                  '---\n\n' +
                  '💡 提示：AI 自动解析可能不完全准确，请查看并补充完善信息。';
              } else {
                summaryMessage = '❌ TODO 创建失败: ' + item.error;
              }
            } else {
              summaryMessage = '❌ 所有 TODO 创建均失败，请检查输入或稍后重试。';
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: sourceIssueNumber,
              body: summaryMessage
            });
            
            // 如果是通过 ai-todo-inbox 标签触发的，且不是评论触发，关闭原 Issue
            if (context.eventName === 'issues' && context.payload.issue.labels.some(label => label.name === 'ai-todo-inbox')) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: sourceIssueNumber,
                state: 'closed',
                state_reason: 'completed'
              });
            }
